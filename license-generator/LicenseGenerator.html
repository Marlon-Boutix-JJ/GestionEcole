<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur & Décodeur de Licence Pro (Indépendant)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.95);
      --primary-emerald: #059669;
      --emerald-glow: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #064e3b 0%, var(--bg-dark) 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--emerald-glow);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--emerald-glow);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-generate:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .result-box {
      margin-top: 24px;
      padding: 20px;
      background: rgba(6, 78, 59, 0.3);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      display: none;
    }

    .result-box.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .key-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #020617;
      border: 1px dashed var(--emerald-glow);
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 8px;
    }

    .key-input-read {
      background: transparent;
      border: none;
      color: var(--emerald-glow);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      width: 100%;
      outline: none;
    }

    .btn-copy {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: var(--emerald-glow);
      color: #000;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">🔒 Outil Administrateur Seul</div>
      <h1>Générateur de Clé de Licence</h1>
      <p class="subtitle">Générez la clé d'activation unique liée au code matériel (HWID) du client.</p>
    </div>

    <div class="form-group">
      <label for="hwidInput">CODE MATÉRIEL CLIENT (HWID) :</label>
      <input type="text" id="hwidInput" placeholder="Ex: HWID-9F8A-3B2C-1D4E" autocomplete="off">
    </div>

    <button class="btn-generate" onclick="generateLicenseKey()">🔑 Générer la Clé Pro</button>

    <div class="result-box" id="resultBox">
      <label>CLÉ D'ACTIVATION PRO GÉNÉRÉE :</label>
      <div class="key-display">
        <input type="text" readonly id="keyResult" class="key-input-read" value="LIC-0000-0000-0000-0000">
        <button class="btn-copy" onclick="copyKey()" id="copyBtn">Copier</button>
      </div>
    </div>

    <div class="footer-note">
      Application 100% hors-ligne & autonome. Ne nécessite aucun serveur ni connexion internet.
    </div>
  </div>

  <script>
    const MASTER_SECRET_KEY = "AGY_SECURE_MASTER_KEY_GESTION_ELEVES_PRO_2026";

    // Pure JavaScript SHA-256 implementation (works under file:// protocol)
    function sha256(ascii) {
      function rightRotate(value, amount) { return (value>>>amount) | (value<<(32 - amount)); }
      var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length';
      var result = '', words = [], asciiBitLength = ascii[lengthProperty] * 8;
      var hash = sha256.h = sha256.h || [];
      var k = sha256.k = sha256.k || [];
      var primeCounter = k[lengthProperty];

      var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (var i = 0; i < 300; i += candidate) { isComposite[i] = true; }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
        }
      }
      
      ascii += '\x80';
      while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
      for (var i = 0; i < ascii[lengthProperty]; i++) {
        var j = ascii.charCodeAt(i);
        if (j >> 8) return;
        words[i >> 2] |= j << ((3 - i % 4) * 8);
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength | 0);
      
      for (var j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16);
        var oldHash = hash;
        hash = hash.slice(0, 8);
        
        for (var i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2];
          var a = hash[0], e = hash[4];
          var temp1 = hash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ ((~e) & hash[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
                w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
              ) | 0
            );
          var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
          hash.pop();
        }
        for (var i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
      }
      
      for (var i = 0; i < 8; i++) {
        for (var j = 3; j >= 0; j--) {
          var b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result.toUpperCase();
    }

    // Pure JS HMAC-SHA256 implementation
    function hmacSha256(key, message) {
      var blockSize = 64;
      if (key.length > blockSize) key = sha256(key);
      var keyBuf = new Array(blockSize).fill(0);
      for (var i = 0; i < key.length; i++) { keyBuf[i] = key.charCodeAt(i); }
      
      var oPad = new Array(blockSize);
      var iPad = new Array(blockSize);
      for (var i = 0; i < blockSize; i++) {
        oPad[i] = keyBuf[i] ^ 0x5c;
        iPad[i] = keyBuf[i] ^ 0x36;
      }
      
      var innerMsg = String.fromCharCode.apply(null, iPad) + message;
      var innerHash = sha256(innerMsg);
      
      var innerHashBytes = '';
      for (var i = 0; i < innerHash.length; i += 2) {
        innerHashBytes += String.fromCharCode(parseInt(innerHash.substr(i, 2), 16));
      }
      
      var outerMsg = String.fromCharCode.apply(null, oPad) + innerHashBytes;
      return sha256(outerMsg);
    }

    function generateLicenseKey() {
      const input = document.getElementById('hwidInput').value.trim().toUpperCase();
      if (!input) {
        alert("Veuillez saisir ou coller le code HWID de l'ordinateur client !");
        return;
      }

      const hashHex = hmacSha256(MASTER_SECRET_KEY, input);

      const part1 = hashHex.substring(0, 4);
      const part2 = hashHex.substring(4, 8);
      const part3 = hashHex.substring(8, 12);
      const part4 = hashHex.substring(12, 16);

      const finalKey = `LIC-${part1}-${part2}-${part3}-${part4}`;

      document.getElementById('keyResult').value = finalKey;
      document.getElementById('resultBox').classList.add('active');
    }

    function copyKey() {
      const keyInput = document.getElementById('keyResult');
      keyInput.select();
      keyInput.setSelectionRange(0, 99999); // Mobile compatibility

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(keyInput.value);
        } else {
          document.execCommand('copy');
        }
      } catch (e) {
        document.execCommand('copy');
      }

      const btn = document.getElementById('copyBtn');
      btn.innerText = "Copié ! ✓";
      btn.style.background = "#10b981";
      btn.style.color = "#000";

      setTimeout(() => {
        btn.innerText = "Copier";
        btn.style.background = "rgba(255, 255, 255, 0.1)";
        btn.style.color = "#ffffff";
      }, 2000);
    }
  </script>
</body>
</html>
