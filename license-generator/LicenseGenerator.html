<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur & Décodeur de Licence Pro (Indépendant)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.95);
      --primary-emerald: #059669;
      --emerald-glow: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #064e3b 0%, var(--bg-dark) 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--emerald-glow);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--emerald-glow);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-generate:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .result-box {
      margin-top: 24px;
      padding: 20px;
      background: rgba(6, 78, 59, 0.3);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      display: none;
    }

    .result-box.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .key-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #020617;
      border: 1px dashed var(--emerald-glow);
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 8px;
    }

    .key-input-read {
      background: transparent;
      border: none;
      color: var(--emerald-glow);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      width: 100%;
      outline: none;
    }

    .btn-copy {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: var(--emerald-glow);
      color: #000;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">🔒 Outil Administrateur Seul</div>
      <h1>Générateur de Clé de Licence</h1>
      <p class="subtitle">Générez la clé d'activation unique liée au code matériel (HWID) du client.</p>
    </div>

    <div class="form-group">
      <label for="hwidInput">CODE MATÉRIEL CLIENT (HWID) :</label>
      <input type="text" id="hwidInput" placeholder="Ex: HWID-9F8A-3B2C-1D4E" autocomplete="off" oninput="generateLicenseKey()" onpaste="setTimeout(generateLicenseKey, 50)">
    </div>

    <button class="btn-generate" onclick="generateLicenseKey()">🔑 Générer la Clé Pro</button>

    <div class="result-box" id="resultBox">
      <label>CLÉ D'ACTIVATION PRO GÉNÉRÉE :</label>
      <div class="key-display" onclick="copyKey()" style="cursor: pointer;" title="Cliquer pour copier">
        <input type="text" readonly id="keyResult" class="key-input-read" value="LIC-0000-0000-0000-0000">
        <button class="btn-copy" onclick="event.stopPropagation(); copyKey();" id="copyBtn">Copier</button>
      </div>
    </div>

    <div class="footer-note">
      Application 100% hors-ligne & autonome. Ne nécessite aucun serveur ni connexion internet.
    </div>
  </div>

  <script>
    const MASTER_SECRET_KEY = "AGY_SECURE_MASTER_KEY_GESTION_ELEVES_PRO_2026";

    // Standard Uint8Array byte-level SHA256 & HMAC-SHA256 (100% match with Node crypto)
    function sha256Bytes(bytes) {
      function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
      
      var K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];

      var H = [
        0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
        0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
      ];

      var l = bytes.length;
      var bitLen = l * 8;

      var paddedLen = Math.ceil((l + 9) / 64) * 64;
      var padded = new Uint8Array(paddedLen);
      padded.set(bytes);
      padded[l] = 0x80;

      var dataView = new DataView(padded.buffer);
      dataView.setUint32(paddedLen - 4, bitLen & 0xffffffff, false);
      dataView.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);

      var W = new Uint32Array(64);

      for (var chunk = 0; chunk < paddedLen; chunk += 64) {
        for (var i = 0; i < 16; i++) {
          W[i] = dataView.getUint32(chunk + i * 4, false);
        }
        for (var i = 16; i < 64; i++) {
          var s0 = rightRotate(W[i - 15], 7) ^ rightRotate(W[i - 15], 18) ^ (W[i - 15] >>> 3);
          var s1 = rightRotate(W[i - 2], 17) ^ rightRotate(W[i - 2], 19) ^ (W[i - 2] >>> 10);
          W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
        }

        var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];

        for (var i = 0; i < 64; i++) {
          var S1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
          var ch = (e & f) ^ ((~e) & g);
          var temp1 = (h + S1 + ch + K[i] + W[i]) | 0;
          var S0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
          var maj = (a & b) ^ (a & c) ^ (b & c);
          var temp2 = (S0 + maj) | 0;

          h = g;
          g = f;
          f = e;
          e = (d + temp1) | 0;
          d = c;
          c = b;
          b = a;
          a = (temp1 + temp2) | 0;
        }

        H[0] = (H[0] + a) | 0;
        H[1] = (H[1] + b) | 0;
        H[2] = (H[2] + c) | 0;
        H[3] = (H[3] + d) | 0;
        H[4] = (H[4] + e) | 0;
        H[5] = (H[5] + f) | 0;
        H[6] = (H[6] + g) | 0;
        H[7] = (H[7] + h) | 0;
      }

      var res = new Uint8Array(32);
      var resView = new DataView(res.buffer);
      for (var i = 0; i < 8; i++) {
        resView.setUint32(i * 4, H[i], false);
      }
      return res;
    }

    function hmacSha256(keyStr, msgStr) {
      var encoder = new TextEncoder();
      var key = encoder.encode(keyStr);
      var msg = encoder.encode(msgStr);

      var blockSize = 64;
      if (key.length > blockSize) {
        key = sha256Bytes(key);
      }

      var keyPadded = new Uint8Array(blockSize);
      keyPadded.set(key);

      var oPad = new Uint8Array(blockSize);
      var iPad = new Uint8Array(blockSize);

      for (var i = 0; i < blockSize; i++) {
        oPad[i] = keyPadded[i] ^ 0x5c;
        iPad[i] = keyPadded[i] ^ 0x36;
      }

      var innerConcat = new Uint8Array(blockSize + msg.length);
      innerConcat.set(iPad, 0);
      innerConcat.set(msg, blockSize);

      var innerHash = sha256Bytes(innerConcat);

      var outerConcat = new Uint8Array(blockSize + 32);
      outerConcat.set(oPad, 0);
      outerConcat.set(innerHash, blockSize);

      var outerHash = sha256Bytes(outerConcat);

      var hex = "";
      for (var i = 0; i < outerHash.length; i++) {
        var b = outerHash[i].toString(16);
        if (b.length === 1) b = "0" + b;
        hex += b;
      }
      return hex.toUpperCase();
    }

    function generateLicenseKey() {
      const rawInput = document.getElementById('hwidInput').value;
      const input = rawInput ? rawInput.trim().toUpperCase() : '';
      
      if (!input) {
        document.getElementById('resultBox').classList.remove('active');
        return;
      }

      const hashHex = hmacSha256(MASTER_SECRET_KEY, input);

      const part1 = hashHex.substring(0, 4);
      const part2 = hashHex.substring(4, 8);
      const part3 = hashHex.substring(8, 12);
      const part4 = hashHex.substring(12, 16);

      const finalKey = `LIC-${part1}-${part2}-${part3}-${part4}`;

      document.getElementById('keyResult').value = finalKey;
      document.getElementById('resultBox').classList.add('active');
    }

    function copyKey() {
      const keyInput = document.getElementById('keyResult');
      const valToCopy = keyInput.value;
      if (!valToCopy || valToCopy.includes('0000-0000')) return;

      let copiedSuccess = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(valToCopy);
          copiedSuccess = true;
        }
      } catch (e) {}

      if (!copiedSuccess) {
        try {
          keyInput.select();
          keyInput.setSelectionRange(0, 99999);
          
          const textArea = document.createElement("textarea");
          textArea.value = valToCopy;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          textArea.style.top = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
          copiedSuccess = true;
        } catch (err) {
          console.error('Copy fallback failed', err);
        }
      }

      const btn = document.getElementById('copyBtn');
      btn.innerText = "Copié ! ✓";
      btn.style.background = "#10b981";
      btn.style.color = "#000";

      setTimeout(() => {
        btn.innerText = "Copier";
        btn.style.background = "rgba(255, 255, 255, 0.1)";
        btn.style.color = "#ffffff";
      }, 2000);
    }
  </script>
</body>
</html>
